<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SocialBot banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="220" y1="40" x2="980" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="blur" x="0" y="0" width="1200" height="320" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <g opacity="0.45" filter="url(#blur)">
    <circle cx="145" cy="90" r="72" fill="#22D3EE"/>
    <circle cx="1060" cy="245" r="86" fill="#818CF8"/>
    <circle cx="910" cy="74" r="58" fill="#34D399"/>
  </g>

  <rect x="64" y="66" width="6" height="188" rx="3" fill="url(#accent)"/>
  <text x="92" y="136" fill="white" font-size="58" font-weight="700" font-family="Segoe UI, Arial, sans-serif">
    SocialBot
  </text>
  <text x="92" y="186" fill="#CBD5E1" font-size="28" font-weight="500" font-family="Segoe UI, Arial, sans-serif">
    A Multi-Modal Emotion Understanding Prototype
  </text>
  <text x="92" y="232" fill="#94A3B8" font-size="22" font-family="Segoe UI, Arial, sans-serif">
    Face • Speech • Text • LLM Agent Fusion
  </text>

  <g transform="translate(846 92)">
    <rect x="0" y="0" width="282" height="140" rx="16" fill="#0B1225" stroke="#334155"/>
    <circle cx="42" cy="42" r="14" fill="#22D3EE"/>
    <circle cx="86" cy="42" r="14" fill="#818CF8"/>
    <circle cx="130" cy="42" r="14" fill="#34D399"/>
    <rect x="28" y="74" width="226" height="10" rx="5" fill="#334155"/>
    <rect x="28" y="96" width="164" height="10" rx="5" fill="#334155"/>
  </g>
</svg>
